name: Update BTC and HYPE weekly data

on:
  schedule:
    - cron: "15 1 * * 1"   # every Monday 01:15 UTC (09:15 Beijing), after the weekly close
    - cron: "15 1 * * 4"   # mid-week refresh on Thursday
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch data
        run: |
          python3 scripts/fetch_data.py
          python3 scripts/fetch_hype.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/btc_weekly.json data/hype_weekly.json
          git diff --cached --quiet || git commit -m "data: update BTC and HYPE weekly candles"
          git push
